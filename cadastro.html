<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Senac - Cadastro de Cursos</title>
</head>
<body>
    <h1>Cadastrar Novo Curso</h1>
    <form action="/cursos" method="POST">
        <label>Nome do Curso:</label><br>
        <input type="text" name="curso" required><br><br>
        
        <label>Carga Horária:</label><br>
        <input type="number" name="ch" required><br><br>
        
        <label>Tipo (EAD/Presencial):</label><br>
        <input type="text" name="tipo" required><br><br>
        
        <button type="submit">Finalizar Cadastro</button>
    </form>
</body>
</html>
